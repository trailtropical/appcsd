<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baixar o app — Corredor Sem Dor</title>
<meta name="description" content="Baixe o app Corredor Sem Dor na App Store ou no Google Play.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0F0F0E;--surface:#1A1A18;--border:rgba(255,255,255,.1);--text:#F0F0EE;--muted:#8A8A87;--accent:#E8500A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 24px;text-align:center}
.logo{width:72px;height:72px;border-radius:16px;margin:0 auto 18px;display:block}
h1{font-size:22px;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.label{font-size:12px;color:var(--muted);margin:0 0 8px;text-align:left}
.btn{display:block;width:100%;padding:15px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;text-align:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{border:1.5px solid var(--accent);color:var(--accent)}
.sep{height:1px;background:var(--border);margin:20px 0}
.note{color:var(--muted);font-size:12.5px;margin-top:24px}
.note a{color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo-csd-quad.jpg" alt="Corredor Sem Dor">
  <h1>Baixe o app</h1>
  <div class="sub">Escolha a loja do seu celular.</div>

  <div class="label">iPhone / iPad</div>
  <a class="btn btn-primary" href="https://apps.apple.com/br/app/corredor-sem-dor/id6824963334">Baixar na App Store</a>

  <div class="sep"></div>

  <div class="label">Android</div>
  <a class="btn btn-outline" href="https://play.google.com/store/apps/details?id=br.com.corredorsemdor">Baixar no Google Play</a>

  <div class="note">
    Depois de instalar, toque em <strong>"Primeiro acesso"</strong> se ainda não criou sua senha, ou em <strong>"Já tenho conta"</strong>.<br><br>
    Dúvidas? <a href="suporte.html">Suporte</a>
  </div>
</div>
</body>
</html>
