<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSD Admin — Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0F0F0E;--surface:#1A1A18;--surface2:#222220;--border:rgba(255,255,255,.06);--text:#F0F0EE;--muted:#8A8A87;--orange:#E8500A;--green:#4ADE80;--red:#EF4444;--amber:#FB923C}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 32px}
.login-title{font-size:22px;font-weight:800;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.field input:focus,.field select:focus{border-color:var(--orange)}
.btn{display:block;width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.btn-s{margin:0;padding:8px 16px;width:auto;display:inline-block;font-size:12px}
.error{color:var(--red);font-size:12px;margin-top:8px;display:none}

/* DASHBOARD */
.dash{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:12px}
.dash-title{font-size:20px;font-weight:800}
.dash-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.dash-btn{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
.dash-btn:hover{border-color:var(--orange);color:var(--orange)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat-val{font-size:24px;font-weight:800;color:var(--orange)}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.03em}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters input,.filters select{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;outline:none}
.filters input:focus,.filters select:focus{border-color:var(--orange)}
.filters input{flex:1;min-width:160px}
.filters select{width:auto;cursor:pointer}
.filter-count{font-size:11px;color:var(--muted);align-self:center}

/* STUDENT LIST */
.student-list{display:flex;flex-direction:column;gap:6px}
.student-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;transition:border .2s;display:flex;align-items:center;gap:12px}
.student-card:hover{border-color:rgba(232,80,10,.3)}
.student-avatar{width:38px;height:38px;border-radius:50%;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);overflow:hidden}
.student-avatar img{width:100%;height:100%;object-fit:cover}
.student-info{flex:1;min-width:0}
.student-name{font-size:13px;font-weight:700}
.student-email{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-meta{display:flex;gap:12px;font-size:10px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.student-meta strong{color:var(--text);font-weight:600}
.student-badge{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
.badge-ok{background:rgba(74,222,128,.12);color:var(--green)}
.badge-warn{background:rgba(251,146,60,.12);color:var(--amber)}
.badge-crit{background:rgba(239,68,68,.12);color:var(--red)}
.badge-gray{background:rgba(138,138,135,.12);color:var(--muted)}
.student-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.student-days{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.days-ok{color:var(--green)}
.days-warn{color:var(--amber)}
.days-crit{color:var(--red)}
.student-alert{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-active{background:var(--green)}
.alert-warn{background:var(--amber)}
.alert-crit{background:var(--red)}
.alert-none{background:var(--border)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,15,14,.94);z-index:100;display:none;overflow-y:auto;padding:20px 12px}
.modal-overlay.open{display:flex;justify-content:center;align-items:flex-start}
.modal{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:0;margin:20px auto;overflow:hidden}
.modal-header{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--border);position:relative}
.modal-avatar{width:44px;height:44px;border-radius:50%;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--muted);overflow:hidden}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-hinfo{flex:1;min-width:0}
.modal-hname{font-size:16px;font-weight:800}
.modal-hemail{font-size:11px;color:var(--muted)}
.modal-hscore{font-size:22px;font-weight:800;color:var(--orange);flex-shrink:0}
.modal-hscore small{font-size:11px;color:var(--muted);font-weight:400}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--text)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;gap:0;background:var(--surface2)}
.tab{flex-shrink:0;padding:10px 18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.tab-body{padding:20px 24px;min-height:200px}
.tab-body .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

/* TIMELINE */
.timeline{position:relative}
.timeline::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl-dot{width:22px;flex-shrink:0;display:flex;justify-content:center;padding-top:2px}
.tl-dot span{display:block;width:10px;height:10px;border-radius:50%;background:var(--border)}
.tl-dot.checkup span{background:var(--orange)}
.tl-dot.exercise span{background:var(--green)}
.tl-dot.note span{background:var(--amber)}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:13px;font-weight:600}
.tl-meta{font-size:10px;color:var(--muted);margin-top:1px}
.tl-detail{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}

/* AVALIACOES */
.av-item{border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:border .2s}
.av-item:hover{border-color:rgba(232,80,10,.3)}
.av-top{display:flex;justify-content:space-between;align-items:center}
.av-date{font-size:12px;font-weight:600}
.av-score{font-size:14px;font-weight:700;color:var(--orange)}
.av-inner{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.av-inner.open{display:block}
.av-cat{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.av-cat .l{color:var(--muted)}
.av-cat .v{font-weight:600}
.av-bar{height:4px;background:var(--border);border-radius:2px;margin:2px 0 6px;overflow:hidden}
.av-fill{height:100%;border-radius:2px}

/* EXERCICIOS - calendar heatmap */
.ex-heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0 16px}
.ex-heat-cell{aspect-ratio:1;border-radius:4px;font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface2)}
.ex-heat-cell.done{background:rgba(74,222,128,.25);color:var(--green);font-weight:600}
.ex-heat-label{font-size:9px;color:var(--muted);text-align:center;padding:4px 0 8px;font-weight:600}
.ex-list{max-height:300px;overflow-y:auto}
.ex-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.ex-row .n{color:var(--muted)}
.ex-row .v{font-weight:500}

/* CALENDARIO */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head button{background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px}
.cal-head button:hover{border-color:var(--orange)}
.cal-head .m{font-size:14px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:9px;color:var(--muted);padding:4px 0;font-weight:600;text-transform:uppercase}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;background:var(--surface2);color:var(--muted);position:relative}
.cal-day.today{border:1px solid var(--orange)}
.cal-day.other{opacity:.3}
.cal-day.has{background:rgba(74,222,128,.15);color:var(--text);font-weight:600}
.cal-day .cdot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--green)}

/* OBSERVACOES */
.obs-form{display:flex;gap:8px;margin-bottom:14px}
.obs-form textarea{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:none;min-height:38px;line-height:1.4}
.obs-form textarea:focus{border-color:var(--orange)}
.obs-item{padding:10px 0;border-bottom:1px solid var(--border)}
.obs-item:last-child{border:none}
.obs-text{font-size:13px;line-height:1.4}
.obs-meta{font-size:10px;color:var(--muted);margin-top:4px}
.obs-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;margin-left:8px;opacity:.6}
.obs-del:hover{opacity:1}

/* EXTRAS SECTION */
.extra-section{padding:20px 24px;border-top:1px solid var(--border)}
.extra-title{font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.extra-add{display:flex;gap:8px;margin-bottom:12px}
.extra-add input{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;outline:none}
.extra-add input:focus{border-color:var(--orange)}
.extra-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.extra-item:last-child{border:none}
.extra-item .name{font-weight:500}
.extra-item .toggle{cursor:pointer;font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-family:inherit}
.extra-item .toggle.active{border-color:var(--green);color:var(--green)}
.extra-item .toggle.inactive{border-color:var(--red);color:var(--red)}
.extra-item .del{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;opacity:.5;margin-left:6px}
.extra-item .del:hover{opacity:1}

/* AI SUMMARY */
.ai-box{background:linear-gradient(135deg,rgba(232,80,10,.08),rgba(232,80,10,.02));border:1px solid rgba(232,80,10,.2);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.ai-box .ai-title{font-size:10px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ai-box .ai-text{font-size:12px;line-height:1.5;color:var(--muted)}

/* ALERTS */
.alert-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-size:12px;margin-bottom:8px}
.alert-banner.crit{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red)}
.alert-banner.warn{background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.2);color:var(--amber)}
.alert-banner .alert-icon{font-size:14px}
.alert-banner .alert-msg{flex:1}

/* PWA INSTALL */
.pwa-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;font-size:12px}
.pwa-bar .pwa-icon{font-size:18px}
.pwa-bar .pwa-msg{flex:1;color:var(--muted)}
.pwa-bar .pwa-btn{padding:6px 14px;background:var(--orange);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.pwa-bar .pwa-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}

/* RESPONSIVE */
@media(max-width:600px){
  .modal{padding:0;border-radius:12px}
  .modal-header{padding:16px}
  .tab{padding:8px 12px;font-size:11px}
  .tab-body{padding:14px 16px}
  .extra-section{padding:14px 16px}
  .student-card{padding:10px 12px}
  .student-avatar{width:32px;height:32px;font-size:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .filters select{font-size:11px;padding:6px 8px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <div class="login-title">CSD Admin</div>
    <div class="login-sub">Painel de acompanhamento dos alunos</div>
    <div class="field"><label>Email</label><input type="email" id="adm-email" placeholder="seu@email.com"></div>
    <div class="field"><label>Senha</label><input type="password" id="adm-pass" placeholder="Sua senha"></div>
    <div class="error" id="adm-error"></div>
    <button class="btn" id="adm-btn" onclick="adminLogin()">Entrar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash-screen" style="display:none">
  <div class="dash-header">
    <div>
      <div class="dash-title">Corredor Sem Dor — Admin</div>
      <div class="dash-sub" id="dash-sub"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="dash-btn" onclick="refreshData()">⟳ Atualizar</button>
      <button class="dash-btn" onclick="adminLogout()">Sair</button>
    </div>
  </div>

  <div class="stats" id="stats-grid"></div>

  <div class="filters" id="filter-bar">
    <input type="text" id="f-name" placeholder="Buscar por nome ou email..." oninput="applyFilters()">
    <select id="f-dor" onchange="applyFilters()">
      <option value="">Nível de dor: todos</option>
      <option value="0-3">0-3 (leve)</option>
      <option value="4-6">4-6 (moderado)</option>
      <option value="7-10">7-10 (intenso)</option>
    </select>
    <select id="f-inactive" onchange="applyFilters()">
      <option value="">Inativo há: todos</option>
      <option value="3">3+ dias</option>
      <option value="7">7+ dias</option>
      <option value="14">14+ dias</option>
      <option value="30">30+ dias</option>
    </select>
    <select id="f-status" onchange="applyFilters()">
      <option value="">Status: todos</option>
      <option value="active">Ativos</option>
      <option value="inactive">Inativos</option>
    </select>
    <span class="filter-count" id="filter-count"></span>
  </div>

  <div class="student-list" id="student-list"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-wrap">
    <div class="modal-header" id="modal-header"></div>
    <div class="tabs" id="modal-tabs"></div>
    <div class="tab-body" id="modal-body"></div>
    <div class="extra-section" id="modal-extras"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SB_URL = 'https://zjsadtpxdexlflfykqzy.supabase.co'
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpqc2FkdHB4ZGV4bGZsZnlrcXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NDM5NzYsImV4cCI6MjA5OTUxOTk3Nn0.IlssVUm27JoHsK1oPhO6e5yWL_nkPWgfI_4zBfeziic'
let sb, currentUser, allStudents = [], filteredStudents = [], currentStudentId = null
let activeTab = 'timeline'

function $(id) { return document.getElementById(id) }

try { sb = window.supabase.createClient(SB_URL, SB_ANON) } catch(e) { console.error('Supabase init error:', e) }

// ── AUTH ──
async function adminLogin() {
  const email = $('adm-email').value.trim()
  const pass = $('adm-pass').value
  const errEl = $('adm-error')
  const btn = $('adm-btn')
  if (!email || !pass) { errEl.style.display='block'; errEl.textContent='Preencha todos os campos'; return }
  btn.textContent='Entrando...'; btn.disabled=true; errEl.style.display='none'
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass })
  btn.textContent='Entrar'; btn.disabled=false
  if (error) {
    errEl.style.display='block'; errEl.textContent='Email ou senha inválidos'
    return
  }
  currentUser = data.user
  $('login-screen').style.display='none'; $('dash-screen').style.display='block'
  loadDashboard()
}
$('adm-pass')?.addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin() })
async function checkSession() {
  const { data: { session } } = await sb.auth.getSession()
  if (session?.user) {
    currentUser = session.user
    $('login-screen').style.display='none'; $('dash-screen').style.display='block'
    loadDashboard()
  }
}
function adminLogout() { sb.auth.signOut(); currentUser=null; $('dash-screen').style.display='none'; $('login-screen').style.display='flex' }

// ── HELPERS ──
function fmt(d) { return d ? new Date(d).toLocaleDateString('pt-BR') : '—' }
function fmtShort(d) { return d ? new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '—' }
function daysSince(d) { return d ? Math.floor((Date.now()-new Date(d))/86400000) : 999 }
function initials(n,e) { if(n) return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); return (e||'?')[0].toUpperCase() }
function clamp(v,mn,mx) { return Math.max(mn,Math.min(mx,v)) }

// ── DASHBOARD ──
async function loadDashboard() {
  $('dash-sub').textContent = 'Carregando dados...'
  try {
    const [profiles, checkups, sessions, exlogs, extras, notes] = await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('checkups').select('*'),
      sb.from('sessions').select('*'),
      sb.from('exercise_logs').select('*'),
      sb.from('protocol_extras').select('*'),
      sb.from('student_notes').select('*')
    ])
    const students = (profiles.data||[]).filter(p => p.role !== 'admin').map(p => {
      const pCheckups = (checkups.data||[]).filter(c => c.user_id === p.id).sort((a,b) => new Date(b.created_at)-new Date(a.created_at))
      const pSessions = (sessions.data||[]).filter(s => s.user_id === p.id).sort((a,b) => new Date(b.created_at)-new Date(a.created_at))
      const pLogs = (exlogs.data||[]).filter(l => l.user_id === p.id).sort((a,b) => new Date(b.done_at)-new Date(a.done_at))
      const pExtras = (extras.data||[]).filter(e => e.user_id === p.id)
      const pNotes = (notes.data||[]).filter(n => n.user_id === p.id)
      const latestCheckup = pCheckups[0]
      const latestSession = pSessions[0]
      let scores = latestCheckup?.scores || {}
      let overall = 0
      if (scores && typeof scores==='object') { const v=Object.values(scores).filter(x=>typeof x==='number'); if(v.length) overall=Math.round(v.reduce((a,b)=>a+b,0)/v.length) }
      const lastAct = pLogs.length > 0 ? pLogs[0].done_at : (latestSession?.created_at || null)
      const streak = calcStreak(pLogs)
      const totalEx = pLogs.length
      return { ...p, checkups:pCheckups, sessions:pSessions, logs:pLogs, extras:pExtras, notes:pNotes, latestCheckup, latestSession, scores, overall, nivel:latestCheckup?.nivel||'—', plan_month:latestSession?.plan_month??0, last_activity:lastAct, streak, total_ex:totalEx, pain:(p.dor_level||0) }
    })
    allStudents = students
    renderStats()
    applyFilters()
    $('dash-sub').textContent = `Última atualização: ${new Date().toLocaleTimeString('pt-BR')}`
  } catch(e) { $('dash-sub').textContent = 'Erro ao carregar: ' + e.message }
}
function calcStreak(logs) {
  if(!logs.length) return 0; let s=0; const today=new Date(); today.setHours(0,0,0,0)
  const doneDays = new Set(logs.filter(l=>l.checked).map(l=>{const d=new Date(l.done_at); return d.toISOString().slice(0,10)}))
  let d = new Date(today)
  while(doneDays.has(d.toISOString().slice(0,10))) { s++; d.setDate(d.getDate()-1) }
  return s
}

function renderStats() {
  const total = allStudents.length
  const active7 = allStudents.filter(s => daysSince(s.last_activity) <= 7).length
  const atRisk = allStudents.filter(s => s.overall > 0 && s.overall < 40).length
  const avgEx = total ? Math.round(allStudents.reduce((a,s) => a+s.total_ex, 0) / total) : 0
  const newWeek = allStudents.filter(s => daysSince(s.created_at) <= 7).length
  $('stats-grid').innerHTML = `
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-label">Alunos</div></div>
    <div class="stat"><div class="stat-val">${active7}</div><div class="stat-label">Ativos (7d)</div></div>
    <div class="stat"><div class="stat-val">${atRisk}</div><div class="stat-label">Em risco</div></div>
    <div class="stat"><div class="stat-val">${avgEx}</div><div class="stat-label">Média exercícios</div></div>
    <div class="stat"><div class="stat-val">${newWeek}</div><div class="stat-label">Novos (7d)</div></div>`
}

function applyFilters() {
  const q = $('f-name').value.toLowerCase().trim()
  const dor = $('f-dor').value
  const inactive = parseInt($('f-inactive').value) || 0
  const status = $('f-status').value
  let list = allStudents.filter(s => {
    if (q && !(s.nome||'').toLowerCase().includes(q) && !s.email.toLowerCase().includes(q)) return false
    if (dor) { const [mn,mx]=dor.split('-').map(Number); if (s.pain < mn || s.pain > mx) return false }
    if (inactive && daysSince(s.last_activity) < inactive) return false
    if (status==='active' && daysSince(s.last_activity) > 7) return false
    if (status==='inactive' && daysSince(s.last_activity) <= 7) return false
    return true
  })
  filteredStudents = list
  $('filter-count').textContent = list.length + ' de ' + allStudents.length
  renderStudentList(list)
}

function renderStudentList(list) {
  if (!list.length) { $('student-list').innerHTML = '<div class="empty" style="text-align:center;padding:40px;color:var(--muted);font-size:13px">Nenhum aluno encontrado</div>'; return }
  $('student-list').innerHTML = list.map(s => {
    const ds = daysSince(s.last_activity)
    const badgeClass = s.overall >= 70 ? 'badge-ok' : s.overall >= 30 ? 'badge-warn' : s.overall > 0 ? 'badge-crit' : 'badge-gray'
    const badgeText = s.overall >= 70 ? 'Bom' : s.overall >= 30 ? 'Atenção' : s.overall > 0 ? 'Crítico' : 'Sem dados'
    const daysClass = ds <= 3 ? 'days-ok' : ds <= 7 ? 'days-warn' : 'days-crit'
    const alertClass = s.overall >= 70 && ds <= 3 ? 'alert-active' : s.overall >= 30 || ds <= 7 ? 'alert-warn' : 'alert-crit'
    const photoHtml = s.photo_url ? `<img src="${s.photo_url}" alt="">` : initials(s.nome, s.email)
    const painBar = s.pain > 0 ? `<span>Dor: <strong>${s.pain}/10</strong></span>` : ''
    return `<div class="student-card" onclick="openProfile('${s.id}')">
      <div class="student-avatar">${photoHtml}</div>
      <div class="student-info">
        <div class="student-name">${s.nome || s.email.split('@')[0]}</div>
        <div class="student-email">${s.email}</div>
        <div class="student-meta">
          <span>Score: <strong>${s.overall||'—'}</strong></span>
          <span>Streak: <strong>${s.streak} dias</strong></span>
          ${painBar}
          <span>${s.nivel}</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0">
        <div class="student-badge ${badgeClass}">${badgeText}${s.overall>0?' '+s.overall:''}</div>
        <div class="student-days ${daysClass}">${ds === 0 ? 'Hoje' : ds === 1 ? 'Ontem' : ds+'d'}</div>
      </div>
      <div class="student-alert ${alertClass}"></div>
    </div>`
  }).join('')
}

// ── PROFILE ──
function openProfile(userId) {
  currentStudentId = userId
  const s = allStudents.find(x => x.id === userId)
  if (!s) return
  const $m = $('modal'); $m.classList.add('open')
  const photoHtml = s.photo_url ? `<img src="${s.photo_url}" alt="">` : initials(s.nome, s.email)
  $('modal-header').innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-avatar">${photoHtml}</div>
    <div class="modal-hinfo">
      <div class="modal-hname">${s.nome || 'Aluno'}</div>
      <div class="modal-hemail">${s.email}${s.phone ? ' · '+s.phone : ''}</div>
    </div>
    <div class="modal-hscore">${s.overall||'—'}<small>/100</small></div>`
  $('modal-tabs').innerHTML = ['timeline','avaliacoes','exercicios','calendario','observacoes'].map(t =>
    `<div class="tab${t===activeTab?' active':''}" onclick="switchTab('${t}')">${tabLabel(t)}</div>`
  ).join('')
  renderProfileTab()
  renderExtras(s)
}
function closeModal() { $('modal').classList.remove('open'); currentStudentId=null }

$('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal() })

function tabLabel(t) {
  return {timeline:'Timeline',avaliacoes:'Avaliações',exercicios:'Exercícios',calendario:'Calendário',observacoes:'Observações'}[t]||t
}

function switchTab(t) {
  activeTab = t
  $('modal-tabs').querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.textContent.trim()===tabLabel(t)))
  renderProfileTab()
}

function renderProfileTab() {
  const s = allStudents.find(x => x.id === currentStudentId)
  if (!s) return
  const body = $('modal-body')
  if (activeTab === 'timeline') renderTimeline(s, body)
  else if (activeTab === 'avaliacoes') renderAvaliacoes(s, body)
  else if (activeTab === 'exercicios') renderExercicios(s, body)
  else if (activeTab === 'calendario') renderCalendario(s, body)
  else if (activeTab === 'observacoes') renderObservacoes(s, body)
  renderAIBox(s)
}

function renderAIBox(s) {
  const body = $('modal-body')
  const ds = daysSince(s.last_activity)
  const painMsg = s.pain > 0 ? ` · Dor relatada: ${s.pain}/10` : ''
  let alertMsgs = []
  if (ds > 7) alertMsgs.push(`⚠️ ${ds} dias sem atividade`)
  if (s.overall > 0 && s.overall < 40) alertMsgs.push('🔴 Score crítico (abaixo de 40)')
  if (s.streak === 0 && s.total_ex > 0) alertMsgs.push('📉 Streak zerou — possível abandono')
  if (s.checkups && s.checkups.length === 0) alertMsgs.push('🆕 Nunca fez check-up')
  const html = `<div class="ai-box">
    <div class="ai-title">🤖 Resumo automático</div>
    <div class="ai-text">
      ${s.nome||'Aluno'} — score geral ${s.overall||'—'}/100 · nível ${s.nivel||'—'} · streak ${s.streak} dias · ${ds===0?'hoje':ds+' dias sem'} ativo${painMsg}
      ${alertMsgs.length ? '<br><br>'+alertMsgs.join('<br>') : ''}
    </div>
  </div>`
  body.insertAdjacentHTML('afterbegin', html)
}

// ── TIMELINE ──
function renderTimeline(s, body) {
  let items = []
  ;(s.checkups||[]).forEach(c => items.push({ date:c.created_at, type:'checkup', nivel:c.nivel||'—', overall:c.overall||0, scores:c.scores||{} }))
  ;(s.logs||[]).filter(l=>l.checked).forEach(l => items.push({ date:l.done_at, type:'exercise', id:l.exercise_id, session:l.session_id }))
  ;(s.notes||[]).forEach(n => items.push({ date:n.created_at, type:'note', text:n.note, by:n.created_by }))
  items.sort((a,b) => new Date(b.date)-new Date(a.date))
  if (!items.length) { body.innerHTML += '<div class="empty">Nenhuma atividade registrada</div>'; return }
  const g = document.createElement('div'); g.className='timeline'
  items.slice(0,50).forEach(item => {
    const date = fmtShort(item.date)
    const time = new Date(item.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
    let title='', detail=''
    if (item.type==='checkup') {
      g.innerHTML += `<div class="tl-item"><div class="tl-dot checkup"><span></span></div><div class="tl-body"><div class="tl-title">📋 Check-up</div><div class="tl-meta">${date} ${time} · ${item.nivel}</div><div class="tl-detail">Score: ${item.overall||0}/100${item.scores&&typeof item.scores==='object'?' · '+Object.entries(item.scores).map(([k,v])=>k+':'+v).join(' · '):''}</div></div></div>`
    } else if (item.type==='exercise') {
      g.innerHTML += `<div class="tl-item"><div class="tl-dot exercise"><span></span></div><div class="tl-body"><div class="tl-title">🏋️ Exercício feito</div><div class="tl-meta">${date} ${time} · ${item.session||''}</div><div class="tl-detail">${item.id||''}</div></div></div>`
    } else if (item.type==='note') {
      g.innerHTML += `<div class="tl-item"><div class="tl-dot note"><span></span></div><div class="tl-body"><div class="tl-title">📝 Observação</div><div class="tl-meta">${date} ${time}</div><div class="tl-detail">${item.text||''}</div></div></div>`
    }
  })
  body.innerHTML = ''; body.appendChild(g)
}

// ── AVALIAÇÕES ──
function renderAvaliacoes(s, body) {
  const checks = s.checkups||[]
  if (!checks.length) { body.innerHTML = '<div class="empty">Nenhum check-up realizado</div>'; return }
  body.innerHTML = checks.map((c,i) => {
    let scoresHtml = ''
    if (c.scores && typeof c.scores==='object') {
      scoresHtml = Object.entries(c.scores).map(([k,v])=>{
        const col = v>=70 ? 'var(--green)' : v>=40 ? 'var(--amber)' : 'var(--red)'
        return `<div class="av-cat"><span class="l">${k}</span><span class="v">${v}</span></div><div class="av-bar"><div class="av-fill" style="width:${v}%;background:${col}"></div></div>`
      }).join('')
    }
    const ov = c.overall||(c.scores?(vals=>{const v=Object.values(vals).filter(x=>typeof x==='number'); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0})(c.scores):0)
    return `<div class="av-item" onclick="this.querySelector('.av-inner').classList.toggle('open')">
      <div class="av-top"><span class="av-date">${fmt(c.created_at)}</span><span class="av-score">${ov}</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">Nível: ${c.nivel||'—'}</div>
      <div class="av-inner">${scoresHtml}</div>
    </div>`
  }).join('')
}

// ── EXERCÍCIOS ──
function renderExercicios(s, body) {
  const logs = s.logs||[]
  const done = logs.filter(l=>l.checked)
  const total = done.length
  const last7 = done.filter(l=>daysSince(l.done_at)<=7).length
  // Heatmap last 7 days
  let heatHtml = '<div class="ex-heat-label">Últimos 7 dias</div><div class="ex-heat">'
  for (let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i)
    const dayStr = d.toISOString().slice(0,10)
    const dayLabel = d.toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3)
    const count = done.filter(l=>l.done_at?.startsWith(dayStr)).length
    heatHtml += `<div class="ex-heat-cell${count>0?' done':''}" title="${dayStr}: ${count}">${dayLabel}</div>`
  }
  heatHtml += '</div>'
  // Stats
  const ds = daysSince(s.last_activity)
  const incompleto = logs.filter(l=>!l.checked).length
  // Group by date
  const groups = {}
  done.forEach(l => { const k=l.done_at?.slice(0,10); if(k) { if(!groups[k]) groups[k]=[]; groups[k].push(l) } })
  let listHtml = ''
  Object.entries(groups).sort(([a],[b])=>b.localeCompare(a)).slice(0,30).forEach(([date, items]) => {
    listHtml += `<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px">${fmt(date)} (${items.length})</div>`
    items.forEach(l => {
      listHtml += `<div class="ex-row"><span class="n">${l.exercise_id}</span><span class="v">${l.session_id||''} ${new Date(l.done_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div>`
    })
    listHtml += '</div>'
  })
  body.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-val">${last7}</div><div class="stat-label">Últ. 7d</div></div>
    <div class="stat"><div class="stat-val">${s.streak}</div><div class="stat-label">Streak</div></div>
  </div>
  ${heatHtml}
  ${listHtml || '<div class="empty">Nenhum exercício registrado</div>'}`
}

// ── CALENDÁRIO ──
let calMonth = new Date().getMonth(), calYear = new Date().getFullYear()

function renderCalendario(s, body) {
  const doneDays = new Set((s.logs||[]).filter(l=>l.checked).map(l=>l.done_at?.slice(0,10)).filter(Boolean))
  const firstDay = new Date(calYear, calMonth, 1).getDay()
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate()
  const today = new Date().toISOString().slice(0,10)
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
  let html = `<div class="cal-head">
    <button onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendario(allStudents.find(x=>x.id==='${s.id}'),$('modal-body'))">←</button>
    <div class="m">${monthNames[calMonth]} ${calYear}</div>
    <button onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendario(allStudents.find(x=>x.id==='${s.id}'),$('modal-body'))">→</button>
  </div><div class="cal-grid">`
  ;['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d => { html += `<div class="cal-dow">${d}</div>` })
  for (let i=0; i<firstDay; i++) html += '<div></div>'
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const isToday = dateStr === today
    const has = doneDays.has(dateStr)
    html += `<div class="cal-day${isToday?' today':''}${has?' has':''}" title="${dateStr}${has?' ✅':''}">${d}${has?' <span class="cdot"></span>':''}</div>`
  }
  html += '</div>'
  body.innerHTML = html
}

// ── OBSERVAÇÕES ──
async function renderObservacoes(s, body) {
  body.innerHTML = `<div class="obs-form">
    <textarea id="obs-text" placeholder="Adicionar observação..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addObs('${s.id}')}"></textarea>
    <button class="btn btn-s" onclick="addObs('${s.id}')">Enviar</button>
  </div><div id="obs-list"></div>`
  loadObs(s.id)
}
async function loadObs(userId) {
  const s = allStudents.find(x => x.id === userId)
  if (!s) return
  const { data } = await sb.from('student_notes').select('*').eq('user_id', userId).order('created_at', { ascending: false })
  if (data) s.notes = data
  // Fetch profile names for created_by
  const creatorIds = [...new Set((data||[]).map(n=>n.created_by).filter(Boolean))]
  const creators = {}
  if (creatorIds.length) {
    const { data: cprof } = await sb.from('profiles').select('id,nome').in('id', creatorIds)
    if (cprof) cprof.forEach(p => creators[p.id] = p.nome || 'Admin')
  }
  const list = $('obs-list')
  if (!data || !data.length) { list.innerHTML = '<div class="empty">Nenhuma observação</div>'; return }
  list.innerHTML = data.map(n => `<div class="obs-item">
    <div class="obs-text">${escapeHtml(n.note)}</div>
    <div class="obs-meta">${fmt(n.created_at)} · ${creators[n.created_by]||'Admin'}${n.created_by===currentUser?.id?` <button class="obs-del" onclick="delObs('${n.id}','${userId}')">Excluir</button>`:''}</div>
  </div>`).join('')
}
function escapeHtml(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML }
async function addObs(userId) {
  const ta = $('obs-text'); if (!ta?.value.trim()) return
  const { error } = await sb.from('student_notes').insert({ user_id: userId, note: ta.value.trim(), created_by: currentUser?.id })
  if (!error) { ta.value=''; loadObs(userId) }
}
async function delObs(noteId, userId) {
  if (!confirm('Excluir esta observação?')) return
  await sb.from('student_notes').delete().eq('id', noteId)
  loadObs(userId)
}

// ── EXTRAS ──
function renderExtras(s) {
  const el = $('modal-extras')
  const extras = s.extras||[]
  el.innerHTML = `<div class="extra-title">📌 Exercícios extras</div>
    <div class="extra-add">
      <input type="text" id="extra-search" placeholder="Adicionar exercício (nome ou ID)..." onkeydown="if(event.key==='Enter')addExtra('${s.id}')">
      <button class="btn btn-s" onclick="addExtra('${s.id}')">+</button>
    </div>
    <div id="extra-list"></div>`
  renderExtraList(s)
}
function renderExtraList(s) {
  const list = $('extra-list')
  const extras = s.extras||[]
  if (!extras.length) { list.innerHTML = '<div style="font-size:12px;color:var(--muted)">Nenhum exercício extra</div>'; return }
  list.innerHTML = extras.map(e => `<div class="extra-item">
    <span class="name">${e.exercise_id}</span>
    <div>
      <button class="toggle${e.active?' active':' inactive'}" onclick="toggleExtra('${e.id}','${s.id}')">${e.active?'Ativo':'Inativo'}</button>
      <button class="del" onclick="delExtra('${e.id}','${s.id}')">✕</button>
    </div>
  </div>`).join('')
}
async function addExtra(userId) {
  const inp = $('extra-search'); const val = inp?.value.trim().toLowerCase()
  if (!val) return
  const { error } = await sb.from('protocol_extras').insert({ user_id: userId, exercise_id: val, added_by: currentUser?.id })
  if (error) { alert('Erro: '+error.message); return }
  inp.value=''
  const s = allStudents.find(x => x.id === userId)
  const { data } = await sb.from('protocol_extras').select('*').eq('user_id', userId)
  if (data) s.extras = data
  renderExtraList(s)
}
async function toggleExtra(extId, userId) {
  const s = allStudents.find(x => x.id === userId)
  const e = s.extras.find(x => x.id == extId)
  if (!e) return
  await sb.from('protocol_extras').update({ active: !e.active }).eq('id', extId)
  e.active = !e.active
  renderExtraList(s)
}
async function delExtra(extId, userId) {
  if (!confirm('Remover este extra?')) return
  await sb.from('protocol_extras').delete().eq('id', extId)
  const s = allStudents.find(x => x.id === userId)
  s.extras = s.extras.filter(e => e.id != extId)
  renderExtraList(s)
}

// ── REFRESH ──
async function refreshData() {
  $('dash-sub').textContent = 'Atualizando...'
  await loadDashboard()
}

// ── INIT ──
checkSession()
